<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Хуторок</title>
<meta name="theme-color" content="#62c42e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Russo+One&display=swap">
<style>
/* Дневной хутор: небо сверху, трава на фоне, грядки — тёплая земля. Одна дневная тема. */
:root{
  --sky:#8fd3f4; --sky2:#c9ecfb;
  --grass:#6fbf4a; --grass-d:#4c9a3a; --grass-l:#a6dc7c;
  --soil:#a0703f; --soil-d:#7a5229; --soil-l:#c08a52;
  --wood:#f6e2b8; --wood-d:#d9b77a; --ink:#2b2416; --ink-2:#6b5d43;
  --gold:#ffcf3a; --gold-d:#e0a400; --red:#e5533d; --white:#fffdf6;
  --display:'Russo One','Rubik',system-ui,sans-serif;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--grass);color:var(--ink);font-family:var(--body);font-size:15px;overscroll-behavior:none;
  background-image:radial-gradient(circle at 20% 30%,#ffffff14 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,#00000010 0 2px,transparent 3px);background-size:38px 38px,52px 52px}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- вход ---------- */
.auth{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(var(--sky),var(--sky2) 45%,var(--grass) 45.2%)}
.auth .logo{font-family:var(--display);font-size:42px;color:var(--white);text-shadow:0 3px 0 var(--grass-d),0 6px 14px #0003;margin:0}
.auth .sub{color:var(--ink-2);margin:6px 0 22px;font-weight:500;text-align:center;max-width:320px}
.auth .scene{font-size:46px;letter-spacing:6px;margin-bottom:18px;filter:drop-shadow(0 4px 2px #0002)}
.auth-box{width:100%;max-width:360px;background:var(--wood);border:3px solid var(--wood-d);border-radius:22px;padding:18px;box-shadow:0 8px 0 var(--soil-d)}
.auth-tabs{display:flex;background:var(--wood-d);border-radius:12px;padding:4px;margin-bottom:14px}
.auth-tabs button{flex:1;padding:9px;border-radius:9px;font-weight:700;color:var(--ink-2)}
.auth-tabs button.active{background:var(--white);color:var(--ink)}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}
.fld input{font:500 17px var(--body);padding:12px 13px;border-radius:12px;border:2px solid var(--wood-d);background:var(--white);color:var(--ink);text-transform:none;letter-spacing:0;outline:none}
.fld input:focus{border-color:var(--grass-d)}
.err{color:var(--red);font-weight:600;font-size:14px;min-height:1.2em;margin:4px 0 8px}

/* ---------- кнопки ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:14px;font-weight:700;font-size:15px;background:var(--white);border:2px solid var(--wood-d);box-shadow:0 3px 0 var(--wood-d);width:100%}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-d)}
.btn.primary{background:var(--gold);border-color:var(--gold-d);box-shadow:0 3px 0 var(--gold-d)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{width:auto;padding:7px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.5;pointer-events:none}

/* ---------- HUD ---------- */
.app{height:100%;display:flex;flex-direction:column}
.hud{display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(var(--sky),var(--sky2));border-bottom:4px solid var(--grass-d)}
.lvl{position:relative;width:46px;height:46px;flex-shrink:0;border-radius:50%;background:var(--white);border:3px solid var(--gold-d);display:grid;place-items:center;font-family:var(--display);font-size:20px}
.lvl small{position:absolute;top:-7px;right:-6px;font:700 10px var(--body);background:var(--gold);border-radius:6px;padding:1px 4px;border:1.5px solid var(--gold-d)}
.xpw{flex:1;min-width:0}
.xpw b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:12px;background:#ffffffaa;border-radius:8px;border:2px solid #ffffff;overflow:hidden;position:relative}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#7ad04f,#4c9a3a);border-radius:6px;transition:width .4s}
.xpbar span{position:absolute;inset:0;font-size:9px;font-weight:700;display:grid;place-items:center;color:var(--ink)}
.pill{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:20px;background:var(--white);border:2px solid var(--wood-d);font-weight:800;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}


.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 10px}
.toolbar h2{font-family:var(--display);font-weight:400;font-size:22px;color:var(--white);margin:0;text-shadow:0 2px 0 var(--grass-d)}
.hint{color:#20401a;font-size:13px;margin:10px 4px;opacity:.85}
.card .hint,.sheet .hint{color:var(--ink-2)}

/* ---------- заказы ---------- */
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.order{background:var(--white);border:3px solid var(--wood-d);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 var(--soil-d);
  background-image:linear-gradient(var(--wood) 0 30px,transparent 30px)}
.order .who{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.order li{font-size:13.5px;display:flex;justify-content:space-between;gap:6px;color:var(--red)}
.order li.got{color:var(--grass-d)}
.order li b{font-variant-numeric:tabular-nums}
.order .reward{font-weight:800;font-size:14px}
.order .row{display:flex;gap:6px;margin-top:auto}
.order .row .ghost{width:44px;flex-shrink:0}
.order.can{border-color:var(--grass-d)}
.order.wait{align-items:center;justify-content:center;min-height:150px;opacity:.75;background-image:none;border-style:dashed}

/* ---------- соседи ---------- */
.stalls{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.stall{min-height:92px;border-radius:14px;background:var(--white);border:2px solid var(--wood-d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px}
.stall .se{font-size:28px}.stall .se sub,.offer .oe sub{font-size:11px;font-weight:700}
.stall small{font-size:12px;font-weight:700}
.stall.add{border-style:dashed;font-size:24px;font-weight:800;color:var(--ink-2);background:transparent}
.stall.sold{opacity:.6}
.offers{display:flex;flex-direction:column;gap:6px}
.offer,.friend{display:flex;align-items:center;gap:10px;background:var(--white);border:2px solid var(--wood-d);border-radius:14px;padding:8px 10px}
.offer .oe,.friend .fa{font-size:28px;flex-shrink:0}
.oi,.fi{flex:1;min-width:0}
.oi b,.fi b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oi small,.fi small{display:block;font-size:12px;color:var(--ink-2)}
.friend+.friend{margin-top:6px}
.me-box{background:#ffffffbb;border-radius:16px;padding:12px;font-size:13px;line-height:1.45}
.me-box .btn{margin-top:8px}
.net-dot{width:12px;height:12px;border-radius:50%;background:#bbb;border:2px solid var(--white)}
.net-dot.on{background:#3fcf4a}.net-dot.off{background:var(--red)}

/* ---------- лист (модалка снизу) ---------- */
.sheet{position:fixed;inset:0;background:#1a2a1166;display:none;align-items:flex-end;justify-content:center;z-index:50}
.sheet.show{display:flex}
.sheet-box{width:100%;max-width:520px;max-height:86vh;overflow-y:auto;background:var(--wood);border:3px solid var(--wood-d);border-bottom:0;border-radius:24px 24px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.sheet h3{margin:6px 0 0;font-size:15px}
.x{width:36px;height:36px;border-radius:50%;background:var(--white);border:2px solid var(--wood-d);font-size:16px;flex-shrink:0}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pick-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:14px;background:var(--white);border:2px solid var(--wood-d)}
.pick-item .pe{font-size:30px}.pick-item .pn{font-weight:700;font-size:13px}.pick-item .pm{font-size:11px;color:var(--ink-2)}
.check{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--grass-d)}
.inv{display:flex;flex-direction:column;gap:6px}
.inv-row{display:flex;align-items:center;gap:10px;background:var(--white);border-radius:12px;padding:6px 10px;border:2px solid var(--wood-d)}
.inv-row .ie{font-size:24px}.inv-row .in{flex:1;min-width:0;font-weight:600;font-size:14px}.inv-row .in small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-2)}
.inv-row .iq{font-size:16px;font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.big{font-size:20px;font-weight:700;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--white);border-radius:10px;padding:4px 10px;font-weight:600;font-size:13px;border:2px solid var(--wood-d)}

.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--white);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.float{position:fixed;transform:translateX(-50%);font-weight:800;font-size:18px;color:var(--white);text-shadow:0 2px 0 var(--grass-d),0 0 6px #0005;pointer-events:none;z-index:70;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(-50%,-50px);opacity:0}}
@media (min-width:700px){main{max-width:900px;width:100%;margin:0 auto}.field{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}}

/* ---------- карта ---------- */
.app{position:fixed;inset:0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;background:#5f9e3c}
.hud{position:absolute;left:0;right:0;top:0;z-index:5;padding-top:calc(10px + env(safe-area-inset-top,0px));background:linear-gradient(#8fd3f4ee,#8fd3f400);border-bottom:0}
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:7px;z-index:5}
.dock button{position:relative;width:60px;height:62px;border-radius:20px;background:var(--wood);border:3px solid var(--wood-d);box-shadow:0 4px 0 var(--soil-d);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-2)}
.dock button span{font-size:26px;line-height:1}
.dock button:active{transform:translateY(2px);box-shadow:0 2px 0 var(--soil-d)}
.dot{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid var(--white)}
body.visiting .dock,body.visiting #tut{display:none}
#visitBar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--wood);border:3px solid var(--wood-d);border-radius:20px;padding:10px 12px;box-shadow:0 4px 0 var(--soil-d);display:flex;flex-direction:column;gap:8px;width:min(94vw,440px)}
.vb-name{font-weight:700;font-size:15px;text-align:center}
.vb-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.vb-row .btn{flex:1;min-width:110px}
#radial{position:fixed;width:0;height:0;z-index:20}
.rad-title{position:absolute;left:0;top:44px;transform:translateX(-50%);white-space:nowrap;background:#2b2416dd;color:var(--white);font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:10px;pointer-events:none}
.rad-item{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--white);border:3px solid var(--gold-d);box-shadow:0 4px 10px #0004;display:grid;place-items:center;touch-action:none;animation:radIn .18s ease-out both}
.rad-item span{font-size:28px;line-height:1;pointer-events:none}
.rad-item b{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--white);font-size:10.5px;padding:1px 6px;border-radius:8px;white-space:nowrap;pointer-events:none}
.rad-item.off{opacity:.5;border-color:#999}
#radial.dragging .rad-item,#radial.dragging .rad-title{opacity:.25}
@keyframes radIn{from{transform:scale(.3);opacity:0}}
#cursor{position:fixed;z-index:30;font-size:40px;transform:translate(-50%,-110%);pointer-events:none;filter:drop-shadow(0 4px 3px #0005)}
#tip{position:fixed;z-index:25;background:#2b2416e6;color:var(--white);padding:8px 12px;border-radius:12px;font-size:13.5px;font-weight:600;pointer-events:none;max-width:80vw}
#btnAll{position:absolute;right:12px;top:calc(72px + env(safe-area-inset-top,0px));z-index:5;padding:9px 14px;border-radius:999px;background:linear-gradient(#ffe066,#f4b400);border:3px solid #b8860b;box-shadow:0 4px 0 #8a6408,0 6px 14px #0003;font-weight:800;font-size:14px;color:#5a3d00;animation:allPulse 1.6s ease-in-out infinite}
#btnAll b{display:inline-block;min-width:22px;padding:1px 6px;margin-left:4px;border-radius:999px;background:#fff;color:#b8860b;font-size:12px}
#btnAll:active{transform:translateY(2px);box-shadow:0 2px 0 #8a6408}
@keyframes allPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
body.visiting #btnAll{display:none}
#hudGemsBtn{position:absolute;left:12px;top:calc(72px + env(safe-area-inset-top,0px));z-index:5;font-size:13px;padding:4px 10px;box-shadow:0 2px 0 var(--wood-d)}
body.visiting #hudGemsBtn{display:none}
#tip button{pointer-events:auto;margin-left:8px;padding:4px 10px;border-radius:10px;background:linear-gradient(#ffe066,#f4b400);border:2px solid #b8860b;font-weight:800;font-size:13px;color:#5a3d00}
#tip.act{pointer-events:auto}
.job.add{font-size:18px;border-style:dashed;border-color:var(--gold-d);background:#fff8dc}
.task{background:var(--white);border:2px solid var(--wood-d);border-radius:14px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.task .tt{display:flex;justify-content:space-between;gap:8px;font-size:14px}.task .tt small{font-weight:800;color:var(--ink-2)}
.task .bar{grid-column:1;height:8px;background:#00000014;border-radius:5px;overflow:hidden}.task .bar i{display:block;height:100%;background:var(--grass-d)}
.task .btn,.task .tag{grid-column:2;grid-row:1/3}
.task.claimed{opacity:.6}
.task .rw{display:block;font-weight:600;font-size:11.5px;color:var(--ink-2)}
.bonus{text-align:center;font-weight:800;background:#fff3c4;border:2px dashed var(--gold-d);border-radius:12px;padding:8px}.bonus.got{background:#e5f6d8;border-color:var(--grass-d)}
.ldays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.lday{background:var(--white);border:2px solid var(--wood-d);border-radius:10px;padding:4px 2px;text-align:center;display:flex;flex-direction:column;font-size:12px}
.lday small{font-size:9.5px;color:var(--ink-2)}.lday.past{opacity:.45}.lday.now{border-color:var(--gold-d);box-shadow:0 0 0 2px var(--gold);background:#fff3c4}
.crates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.crate{background:#f3dfb8;border:3px solid #a8743c;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.crate .ce{font-size:30px}.crate small{font-size:11px;color:var(--ink-2);min-height:26px}.crate.can{box-shadow:0 0 0 3px var(--gold)}.crate.done{background:#dff1cf;border-color:var(--grass-d)}
.stabs{margin-bottom:10px}.stabs button{position:relative;font-size:12px;padding:8px 2px}
.mini-dot{position:absolute;top:3px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.chat{height:min(46vh,360px);overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:8px;background:#fff8e8;border:2px solid var(--wood-d);border-radius:14px}
.msg{align-self:flex-start;max-width:82%;background:var(--white);border:2px solid var(--wood-d);border-radius:14px 14px 14px 4px;padding:6px 10px;display:flex;flex-direction:column;font-size:14px;word-wrap:break-word}
.msg b{font-size:11.5px;color:var(--grass-d)}.msg small{align-self:flex-end;font-size:10px;color:var(--ink-2)}
.msg.me{align-self:flex-end;background:#e5f6d8;border-color:var(--grass-d);border-radius:14px 14px 4px 14px}
.msg.sys{align-self:center;background:#fff3c4;border:0;border-radius:10px;font-size:12px;font-weight:700;text-align:center}
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 0}.quick .chip{white-space:nowrap}
.chat-in{display:flex;gap:6px}.chat-in input{flex:1;min-width:0;font:500 16px var(--body);padding:10px 12px;border-radius:12px;border:2px solid var(--wood-d);background:var(--white);outline:none}
.qty{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.qty .btn{flex:1;min-width:52px}
.top{display:flex;flex-direction:column;gap:6px}
.top-row{display:grid;grid-template-columns:34px 1fr auto;grid-template-rows:auto auto;align-items:center;column-gap:8px;background:var(--white);border:2px solid var(--wood-d);border-radius:12px;padding:6px 10px}
.top-row .tp{grid-row:1/3;font-size:20px;text-align:center;font-weight:800}.top-row small{grid-column:2/4;font-size:11px;color:var(--ink-2)}.top-row .tl{font-weight:800}
.top-row.me{background:#e5f6d8;border-color:var(--grass-d)}
.card-lite .top-row{margin-top:6px}
.fbar{position:relative;height:26px;background:#00000018;border-radius:14px;overflow:hidden;margin:8px 0;border:2px solid var(--wood-d)}
.fbar i{display:block;height:100%;background:linear-gradient(90deg,#7ad04f,#4caf50)}.fbar span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:13px}
.fstages{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.fstage{background:var(--white);border:2px solid var(--wood-d);border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;text-align:center}
.fstage>b{font-size:16px}.fstage small{font-size:10.5px;color:var(--ink-2)}.fstage.ok{border-color:var(--grass-d);background:#e5f6d8}
#tut{position:absolute;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:6;background:#fffdf6f0;border:3px solid var(--gold-d);border-radius:16px;padding:10px 40px 10px 12px;font-size:14px;font-weight:600;line-height:1.35;box-shadow:0 4px 12px #0003;max-width:520px;margin:0 auto}
#tut button{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--wood);font-size:13px}
#hint{position:absolute;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:6;background:#2b2416dd;color:var(--white);padding:6px 12px;border-radius:10px;font-weight:700;font-size:13px}
.fly{position:fixed;z-index:40;transform:translate(0,0);font-size:22px;font-weight:800;color:var(--white);text-shadow:0 2px 0 var(--grass-d),0 0 6px #0006;pointer-events:none;transition:transform .8s cubic-bezier(.5,-0.3,.7,1),opacity .8s;margin:-14px 0 0 -14px;white-space:nowrap}
/* ---------- окна ---------- */
.queue{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.job{position:relative;min-height:62px;border-radius:12px;background:var(--white);border:2px solid var(--wood-d);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;overflow:hidden;padding-bottom:6px}
.job small{font-size:10.5px;font-weight:700;color:var(--ink-2)}
.job .bar{position:absolute;left:6px;right:6px;bottom:4px;height:4px;background:#00000018;border-radius:3px;overflow:hidden}
.job .bar i{display:block;height:100%;background:var(--grass-d)}
.job.done{border-color:var(--gold-d);box-shadow:0 0 0 2px var(--gold)}
.job.empty{font-size:11px;color:#b9a27a;border-style:dashed}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.recipe{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;text-align:left;padding:8px 10px;border-radius:12px;background:#ffffff99;border:2px solid transparent}
.recipe .re{grid-row:1/3;font-size:26px;align-self:center}
.recipe .re sub{font-size:11px;font-weight:700}
.recipe .rn{font-weight:700;font-size:13px}
.recipe .ri{font-size:11.5px;color:var(--ink-2)}
.recipe.ok{border-color:var(--grass-d);background:var(--white)}
.recipe.lock{opacity:.5}
.seg{display:flex;background:var(--wood-d);border-radius:12px;padding:4px}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:700;color:var(--ink-2)}
.seg button.active{background:var(--white);color:var(--ink)}
.shop{display:flex;flex-direction:column;gap:6px}
.shop-row{display:flex;align-items:center;gap:10px;background:var(--white);border:2px solid var(--wood-d);border-radius:14px;padding:8px 10px}
.shop-row.done{opacity:.65}
.shop-row .se{font-size:28px;width:36px;text-align:center}
.shop-row .si{flex:1;min-width:0}.shop-row .si b{display:block;font-size:14px}.shop-row .si small{font-size:12px;color:var(--ink-2)}
.new-tag{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;color:#fff;background:#e5533d;border-radius:6px;padding:1px 5px;vertical-align:middle}
.tag{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--wood);border-radius:8px;padding:3px 8px;white-space:nowrap}
.card-lite{background:#ffffff88;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.card-lite > small{color:var(--ink-2);font-size:12.5px;margin-top:-6px}
.truck-line{background:var(--white);border-radius:12px;padding:10px;font-weight:700;text-align:center}
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hud .pill{box-shadow:0 2px 0 var(--wood-d)}
.hud-btn{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:var(--white);border:2px solid var(--wood-d);font-size:18px}

/* ---------- оформление в духе Hay Day: звезда уровня, «деревянные» плашки, зелёные кнопки ---------- */
:root{--ol:#4a2a0e;--hd-green:#62c42e;--hd-green-d:#2f7d14;
  --outline:-1.5px -1.5px 0 var(--ol),1.5px -1.5px 0 var(--ol),-1.5px 1.5px 0 var(--ol),1.5px 1.5px 0 var(--ol),0 2.5px 0 var(--ol)}
.hud{background:linear-gradient(#0000002e,#0000)!important;gap:6px!important}
.lvl{width:56px;height:56px;border:0!important;border-radius:0!important;background:none!important;filter:drop-shadow(0 3px 0 #9a5b00) drop-shadow(0 4px 6px #0004)}
.lvl::before{content:'';position:absolute;inset:0;background:linear-gradient(#fff38a,#ffc61a 55%,#f39c12);clip-path:polygon(50% 0,62% 33%,98% 35%,69% 57%,80% 94%,50% 72%,20% 94%,31% 57%,2% 35%,38% 33%)}
.lvl span{position:relative;color:#fff;font-size:19px;margin-top:5px;text-shadow:-1.3px -1.3px 0 #8a4b00,1.3px -1.3px 0 #8a4b00,-1.3px 1.3px 0 #8a4b00,1.3px 1.3px 0 #8a4b00,0 2px 0 #8a4b00}
.lvl small{display:none}
.xpw b{color:#fff!important;font-family:var(--display)!important;font-weight:400!important;font-size:14px!important;text-shadow:var(--outline)}
.xpbar{height:17px!important;border:2.5px solid var(--ol)!important;background:#2b1d0f99!important;border-radius:10px!important;margin-top:2px}
.xpbar i{background:linear-gradient(#b8f57a,#5cbf2a 60%,#3f9a1c)!important}
.xpbar span{color:#fff!important;font-size:10px!important;text-shadow:-1px -1px 0 var(--ol),1px -1px 0 var(--ol),-1px 1px 0 var(--ol),1px 1px 0 var(--ol)}
.hud .pill,#hudGemsBtn{background:linear-gradient(#fffbe9,#f4d995)!important;border:2.5px solid #8a5a2b!important;box-shadow:0 3px 0 #6b4220,0 4px 8px #0003!important;
  font-family:var(--display);font-weight:400;font-size:15px;color:#fff;text-shadow:var(--outline);padding:5px 10px 5px 8px!important;border-radius:999px!important}
#hudGemsBtn{left:auto!important;right:12px!important;top:calc(64px + env(safe-area-inset-top,0px))!important;background:linear-gradient(#f2fff0,#bfeeb2)!important;border-color:#2f7d14!important;box-shadow:0 3px 0 #1f5c0c,0 4px 8px #0003!important}
#btnAll{right:auto!important;left:12px!important;top:calc(76px + env(safe-area-inset-top,0px))!important;font-family:var(--display);font-weight:400;color:#fff!important;text-shadow:var(--outline);
  background:linear-gradient(#a8f06a,#5cbf2a 60%,#3f9a1c)!important;border:3px solid var(--ol)!important;box-shadow:0 4px 0 #2a5a10,0 6px 14px #0004!important}
#btnAll b{color:#2f7d14!important;text-shadow:none}
/* кнопки */
.btn{border:2.5px solid #b07a3c!important;box-shadow:0 3px 0 #8a5a2b!important;background:linear-gradient(#fffdf4,#f6e4bb)!important;color:#5a3a1a}
.btn.primary{background:linear-gradient(#9ff05e,#5cbf2a 55%,#3f9a1c)!important;border-color:var(--ol)!important;box-shadow:0 3px 0 #2a5a10!important;color:#fff!important;
  font-family:var(--display);font-weight:400;text-shadow:-1.2px -1.2px 0 #2a4a0e,1.2px -1.2px 0 #2a4a0e,-1.2px 1.2px 0 #2a4a0e,1.2px 1.2px 0 #2a4a0e,0 2px 0 #2a4a0e}
.btn.ghost{background:transparent!important;box-shadow:none!important;border-color:transparent!important}
.btn:disabled{filter:grayscale(.6)}
/* окна */
.sheet-box{background:linear-gradient(#fff6dc,#f6e2b0)!important;border:4px solid #a8733a!important;border-bottom:0!important;box-shadow:inset 0 0 0 3px #fff3d0,0 -6px 20px #0004}
.sheet-h h3{font-size:22px!important;color:#fff;text-shadow:var(--outline);letter-spacing:.3px}
.x{background:radial-gradient(circle at 35% 30%,#ff8a7a,#e53935 60%,#b71c1c)!important;border:3px solid #fff!important;color:#fff;font-weight:800;box-shadow:0 3px 0 #7f1010,0 4px 8px #0004}
/* нижняя панель: круглые деревянные кнопки, магазин — зелёный */
.dock{gap:6px!important}
.dock button{width:62px!important;height:62px!important;border-radius:50%!important;background:radial-gradient(circle at 40% 30%,#fff7df,#f1d396 70%,#d8ad62)!important;border:3px solid #8a5a2b!important;
  box-shadow:0 4px 0 #5c3a18,0 6px 12px #0004!important;font-size:9.5px!important;color:#fff!important;font-family:var(--display);font-weight:400!important;text-shadow:-1px -1px 0 var(--ol),1px -1px 0 var(--ol),-1px 1px 0 var(--ol),1px 1px 0 var(--ol)}
.dock button span{font-size:25px!important;text-shadow:none;filter:drop-shadow(0 2px 0 #0003)}
.dock #btnShop{background:radial-gradient(circle at 40% 30%,#c6ff8e,#62c42e 65%,#3f9a1c)!important;border-color:#2a5a10!important;box-shadow:0 4px 0 #1f4a0a,0 6px 12px #0004!important}
#tut{border-color:#a8733a!important;background:linear-gradient(#fffbe9,#f8e7bd)!important}
.order{border-color:#a8733a!important}
#placeBar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;align-items:center;gap:10px;background:linear-gradient(#fffbe9,#f4d995);border:3px solid #8a5a2b;border-radius:999px;padding:6px;box-shadow:0 4px 0 #6b4220,0 6px 14px #0004;max-width:calc(100% - 24px)}
#placeBar span{font-family:var(--display);color:#fff;text-shadow:var(--outline);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
#placeBar button{width:52px;height:52px;flex-shrink:0;border-radius:50%;font-size:26px;color:#fff;font-weight:800;border:3px solid #fff;box-shadow:0 3px 0 #0005}
#placeYes{background:radial-gradient(circle at 35% 30%,#b5ff7a,#5cbf2a 60%,#2f7d14)}
#placeNo{background:radial-gradient(circle at 35% 30%,#ff8a7a,#e53935 60%,#b71c1c)}
body.placing .dock,body.placing #btnAll,body.placing #tut{display:none!important}
.stabs{flex-wrap:wrap;gap:3px}.stabs button{font-size:11.5px!important;padding:7px 4px!important;flex:1 1 30%}
.hood-row{display:flex;align-items:center;gap:10px;background:var(--white);border:2px solid var(--wood-d);border-radius:14px;padding:8px 10px;margin-top:6px}
.hood-row .he,.hood-head .he{font-size:30px;flex-shrink:0}.hood-row .hi{flex:1;min-width:0;display:flex;flex-direction:column}.hood-row small{font-size:11.5px;color:var(--ink-2)}.hood-row .hd{font-style:italic}
.hood-head{display:flex;align-items:center;gap:12px;background:linear-gradient(#e9f8d8,#cdeeb0);border:3px solid #5cbf2a;border-radius:16px;padding:10px 12px}
.hood-head .he{font-size:38px}.hood-head b{font-family:var(--display);font-weight:400;font-size:18px;color:#fff;text-shadow:var(--outline);display:block}.hood-head small{color:#2f5a1a;font-size:12.5px}
.emb{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.emb button{width:40px;height:40px;border-radius:12px;font-size:22px;background:#fff;border:2px solid var(--wood-d)}.emb button.on{border-color:#2f7d14;box-shadow:0 0 0 3px #9ff05e}
.card-lite .fld{margin:8px 0}
.top-row a{color:#2f7d14;font-weight:700}
.msg{position:relative}.msg-del{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#e53935;color:#fff;font-size:11px;font-weight:800;border:2px solid #fff}
.on-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#43d13a;box-shadow:0 0 0 2px #fff,0 0 6px #43d13a;margin:0 5px 1px 1px;vertical-align:middle}
.lvl.big span{font-size:13px!important;margin-top:7px!important}
</style>
</head>
<body>

<section class="auth" id="auth">
  <div class="scene">🌻🐔🌾🐄</div>
  <h1 class="logo">Хуторок</h1>
  <p class="sub">Ферма для своих: сажай, корми, торгуй с друзьями</p>
  <div class="auth-box">
    <div class="auth-tabs"><button data-mode="new">Новая ферма</button><button data-mode="login">У меня есть</button></div>
    <label class="fld">Имя фермы <input id="authNick" maxlength="20" autocomplete="username" placeholder="Например: Солнечный"></label>
    <label class="fld">PIN (4–6 цифр) <input id="authPin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="••••"></label>
    <p class="err" id="authErr"></p>
    <button class="btn primary" id="authGo">Создать ферму</button>
    <p class="hint" id="authHint" style="color:var(--ink-2);margin:10px 0 0"></p>
  </div>
</section>

<div class="app" id="app" hidden>
  <canvas id="map" aria-label="Карта хутора"></canvas>
  <header class="hud">
    <div class="lvl"><span id="hudLvl">1</span><small>ур.</small></div>
    <div class="xpw"><b id="hudNick"></b><div class="xpbar"><i id="hudXp"></i><span id="hudXpText"></span></div></div>
    <div class="pill">🪙 <span id="hudCoins">0</span></div>
    <button class="pill" id="hudStoreBtn" title="Амбар">📦 <span id="hudStore">0</span></button>
  </header>
  <div id="tut" hidden><span></span><button aria-label="Скрыть подсказки">✕</button></div>
  <div id="hint" hidden></div>
  <button class="pill" id="hudGemsBtn" title="Кристаллы">💎 <span id="hudGems">0</span></button>
  <button id="btnAll" hidden>✨ Собрать всё <b>0</b></button>
  <div id="placeBar" hidden><button id="placeNo" aria-label="Отмена">✖</button><span id="placeText"></span><button id="placeYes" aria-label="Поставить">✔</button></div>
  <nav class="dock">
    <button id="btnShop"><span>🛒</span>Магазин</button>
    <button id="btnOrders"><span>📋</span>Заказы<i class="dot" id="ordersDot" hidden></i></button>
    <button id="btnDaily"><span>🎯</span>Задания<i class="dot" id="dailyDot" hidden></i></button>
    <button id="btnFriends"><span>👋</span>Соседи<i class="dot" id="friendsDot" hidden></i></button>
    <button id="btnSettings"><span>⚙️</span>Ещё</button>
  </nav>
  <div id="visitBar" hidden></div>
</div>

<div id="radial" hidden></div>
<div id="cursor" hidden></div>
<div id="tip" hidden></div>

<div class="sheet" id="sheet"><div class="sheet-box">
  <div class="sheet-h"><h3 id="sheetTitle"></h3><button class="x" id="sheetClose" aria-label="Закрыть">✕</button></div>
  <div id="sheetBody" style="display:flex;flex-direction:column;gap:12px"></div>
</div></div>
<div class="toast" id="toast"></div>

<script src="data.js?v=21"></script>
<script src="art.js?v=21"></script>
<script src="machines.js?v=21"></script>
<script src="fx.js?v=21"></script>
<script src="life.js?v=21"></script>
<script src="sprites.js?v=21"></script>
<script src="game.js?v=21"></script>
<script src="extra.js?v=21"></script>
<script src="engine.js?v=21"></script>
<script src="net.js?v=21"></script>
<script src="social.js?v=21"></script>
<script src="hood.js?v=21"></script>
<script src="admin.js?v=21"></script>
</body>
</html>
