name: Напоминание во ВКонтакте

on:
  schedule:
    - cron: '55 2 * * *'   # каждый день около 07:00 по Самаре (запуск в 02:55 UTC, GitHub часто опаздывает на несколько минут)
  workflow_dispatch: {}     # кнопка «Run workflow» для ручной проверки

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Отправить сводку
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: node reminder/vk-reminder.mjs
