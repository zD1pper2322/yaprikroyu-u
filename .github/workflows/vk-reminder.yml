name: Напоминание во ВКонтакте

on:
  # Запуск по сигналу с cron-job.org каждый день в 07:00 (там и меняется время).
  # Своё расписание GitHub выключено: оно запускало сводку с опозданием на часы.
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Отправить сводку
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: node reminder/vk-reminder.mjs
