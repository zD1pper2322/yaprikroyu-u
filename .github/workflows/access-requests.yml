name: Запросы доступа во ВКонтакте

on:
  # запускает cron-job.org каждые 5 минут; свой таймер GitHub убран — он дублировал запуски
  workflow_dispatch: {}

concurrency:
  group: access-requests
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Отправить новые запросы
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          FIREBASE_BOT: ${{ secrets.FIREBASE_BOT }}
        run: node reminder/access-requests.mjs
